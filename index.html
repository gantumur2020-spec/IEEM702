<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>I.EEM702 Цахилгаан системийн тооцооны орчин үеийн аргууд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: green sidebar + content column + right info rail; collapses to one column on phones */
:root{
  --navy:#0f4a37; --navy-2:#0b3a2b; --side-fg:#e3f3ea; --side-muted:#9fcfb6;
  --bg:#f2f6f3; --surface:#ffffff; --surface-2:#f6faf7; --line:#dce9e1;
  --fg:#14261d; --muted:#566b60; --accent:#1b8a5a; --accent-soft:#e3f4ea;
  --ok:#14804a; --ok-soft:#e3f5ea; --warn:#b5650d; --warn-soft:#fff1de; --bad:#c0352b; --bad-soft:#fde8e6;
  --f-body:"Noto Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --fs:15px; --radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0b2a1f; --navy-2:#071f16; --side-fg:#d8efe2; --side-muted:#8fbfa5;
  --bg:#0f1a15; --surface:#16241d; --surface-2:#1c2d25; --line:#2c4237;
  --fg:#e6f2eb; --muted:#9fb8aa; --accent:#4cd08f; --accent-soft:#173a2b;
  --ok:#4cc488; --ok-soft:#173a2b; --warn:#f0a54b; --warn-soft:#3d2d16; --bad:#ff7b70; --bad-soft:#40201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0b2a1f; --navy-2:#071f16; --side-fg:#d8efe2; --side-muted:#8fbfa5;
  --bg:#0f1a15; --surface:#16241d; --surface-2:#1c2d25; --line:#2c4237;
  --fg:#e6f2eb; --muted:#9fb8aa; --accent:#4cd08f; --accent-soft:#173a2b;
  --ok:#4cc488; --ok-soft:#173a2b; --warn:#f0a54b; --warn-soft:#3d2d16; --bad:#ff7b70; --bad-soft:#40201e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.6}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--navy);color:var(--side-fg);padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand svg{flex:none}
.brand b{display:block;font-size:15px;color:var(--side-strong,#fff);line-height:1.2}
.brand small{color:var(--side-muted);font-size:12px}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);margin:16px 10px 6px;font-weight:600}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;background:none;border:0;text-align:left;font-size:14px}
.nav a:hover,.nav button:hover{background:var(--side-hover,rgba(255,255,255,.07))}
.nav a.on{background:var(--accent);color:#fff}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.sub{margin:2px 0 6px 18px;border-left:1px solid var(--side-line,rgba(255,255,255,.12));padding-left:6px}
.sub a{font-size:13px;padding:5px 8px;gap:8px}
.sub a .n{font-family:var(--f-mono);font-size:11px;color:var(--side-muted);width:18px}
.sub a.on .n,.nav a.on .n{color:#fff!important}
.sub a .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#3fbf7f}
.chev{margin-left:auto;transition:transform .2s}
.open>.chev{transform:rotate(90deg)}

/* main */
.main{min-width:0;padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.search input{border:0;outline:0;background:none;color:var(--fg);font:inherit;width:100%}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.layout.full{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card h2{font-size:17px;margin-bottom:12px}
.card h3{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--hero,linear-gradient(115deg,#0b3a2b 0%,#16714b 55%,#c9a227 100%));color:#fff;padding:26px 28px;min-height:220px}
.hero svg.towers{position:absolute;right:0;bottom:0;height:100%;width:62%;opacity:.55;pointer-events:none}
.hero>*{position:relative}
.hero .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;background:rgba(255,255,255,.14);padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:10px}
.hero h1{font-size:clamp(22px,3vw,30px);max-width:18ch;font-weight:800}
.hero p{max-width:56ch;color:#e2f5ea;font-size:14px;margin:10px 0 16px}
.hero .meta{font-size:13px;color:#cdeedb}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:6px}
.stats div{font-size:12px;color:#cdeedb}
.stats b{display:block;font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.prog{position:absolute!important;top:24px;right:28px;width:220px;font-size:13px}
.bar{height:7px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none}
.btn.pri{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.light{background:#fff;color:#0f4a37}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* lecture list */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lesson{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);background:var(--surface)}
.lesson:hover{border-color:var(--accent)}
.lesson .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.lesson b{font-size:14px;display:block;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}

/* lecture page */
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted);text-decoration:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.prose{max-width:74ch}
.prose h3{font-size:17px;margin:26px 0 8px}
.prose h4{font-size:15px;margin:18px 0 6px}
.prose p,.prose li{margin:0 0 10px}
.prose ul,.prose ol{padding-left:22px}
.eq{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;margin:12px 0;overflow-x:auto;font-size:14px;white-space:nowrap}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14px}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600}
td.c,th.c{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.goals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.goals span{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px}

/* video */
.video{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.vthumb{width:150px;max-width:100%;aspect-ratio:16/9;border-radius:8px;background:linear-gradient(135deg,#0b3a2b,#1b8a5a);display:grid;place-items:center;flex:none}
.vthumb svg{width:38px;height:38px;fill:#fff}

/* quiz */
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.q p{margin:0 0 10px;font-weight:600}
.q p .qn{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.q label:hover{background:var(--surface-2)}
.q input{margin-top:5px;accent-color:var(--accent)}
.q label.right{background:var(--ok-soft);border-color:var(--ok)}
.q label.wrong{background:var(--bad-soft);border-color:var(--bad)}
.q .why{font-size:13.5px;color:var(--muted);margin-top:8px;display:none}
.done .q .why{display:block}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:10px;background:var(--accent-soft);margin-bottom:14px}
.score b{font-size:22px;font-variant-numeric:tabular-nums}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}

/* side info */
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13.5px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:600}
.stepl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.stepl li{display:flex;gap:10px}
.stepl li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}

/* calculator */
.calc input{width:80px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font-family:var(--f-mono);font-size:13px}

/* settings */
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px}
.opt button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.empty{text-align:center;padding:30px 16px}
.empty svg{width:54px;height:54px;stroke:var(--muted);fill:none;stroke-width:1.5}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .25s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.show{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .menu-btn{display:inline-block}
  .prog{position:static!important;width:auto;margin-top:14px}
  .who span{display:none}
  .hero svg.towers{width:100%;opacity:.25}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.formrow .field{flex:1 1 180px}
.status{font-size:13.5px;padding:10px 12px;border-radius:9px;margin-top:10px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.codebox{font-family:var(--f-mono);font-size:18px;letter-spacing:.12em;font-weight:600}
.gradetbl td.c b{color:var(--ok)}
.labn{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.labitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.labitem:last-child{border:0}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px}

.login{max-width:440px;margin:6vh auto 0}
.login .hero{min-height:0;margin-bottom:14px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.sw{width:118px;border:2px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--surface);color:var(--fg);text-align:left}
.sw.on{border-color:var(--fg)}
.sw i{display:block;height:34px;position:relative}
.sw i b{position:absolute;left:0;top:0;bottom:0;width:30%;border-right:1px solid rgba(0,0,0,.08)}
.swgrp{font-size:12px;color:var(--muted);margin:10px 0 0;font-weight:600}
.sw span{display:block;font-size:12px;padding:4px 8px}
.roster{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--fg)}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--side-fg);padding:10px 12px;margin-top:10px;border-top:1px solid var(--side-line,rgba(255,255,255,.12))}
.userchip button{margin-left:auto;background:none;border:1px solid var(--side-line,rgba(255,255,255,.3));color:var(--side-fg);border-radius:7px;padding:3px 9px;font-size:12px}

/* эвхэгддэг лекцийн жагсаалт */
.lecgrp{display:flex!important;align-items:center;gap:8px;margin:14px 0 4px;padding:9px 10px!important;border-radius:9px;background:var(--side-btn,rgba(255,255,255,.06))!important;color:var(--side-strong,#fff)!important;font-weight:700;font-size:13px!important;letter-spacing:.06em;text-transform:uppercase}
.lecgrp:hover{background:var(--side-btn-h,rgba(255,255,255,.12))!important}
.lecgrp .cnt{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:0;background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;text-transform:none}
.lecgrp .cur{font-weight:500;letter-spacing:0;text-transform:none;color:var(--side-muted);font-size:12px}
.lecgrp .chev{margin-left:auto;width:16px!important;height:16px!important;transition:transform .2s}
.lecgrp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub{overflow:hidden;transition:max-height .28s ease,opacity .2s;max-height:1200px}
.sub.closed{max-height:0;opacity:0;margin-top:0;margin-bottom:0;visibility:hidden}
.sub a{align-items:flex-start;line-height:1.35;color:var(--side-soft,rgba(255,255,255,.72))}
.sub a:nth-child(odd){background:var(--side-stripe,rgba(255,255,255,.035))}
.sub a:hover{color:var(--side-strong,#fff)}
.sub a .n{flex:none;font-weight:700;color:var(--side-strong,rgba(255,255,255,.95));padding-top:1px}
.sub a.on{color:#fff;font-weight:600}
.sub a .dot{flex:none;margin-top:6px}
@media (prefers-reduced-motion:reduce){.sub,.lecgrp .chev{transition:none}}
/* lecture read-aloud (Mongolian text-to-speech) */
.tts-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tts-bar .btn{padding:8px 13px}
.tts-bar select{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%}
.tts-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.tts-opts label{display:flex;gap:6px;align-items:center}
.tts-prog{height:5px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:12px}
.tts-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tts-text{max-height:620px;overflow-y:auto;margin-top:12px;padding:4px 14px 4px 4px;border-top:1px solid var(--line)}
.tts-text .tb{padding:6px 10px;border-radius:8px;margin:2px 0;cursor:pointer;border-left:3px solid transparent}
.tts-text .tb:hover{background:var(--surface-2)}
.tts-text .tb.h{font-weight:700;font-size:15.5px;margin-top:12px}
.tts-text .tb.feq{display:flex;align-items:center;gap:10px;color:var(--fg);padding:8px 10px}
.tts-text .tb.feq .mm{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;text-align:center}
.tts-text math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",math;font-size:1.18em;color:var(--fg)}
.tts-text .tb.feq .eqn{flex:none;font-family:"Cambria Math","Times New Roman",serif}
.tts-text .tb.feq img{display:block;margin:0 auto;max-width:100%;height:auto;background:#fff;border-radius:6px;padding:4px}
.tts-text sub,.tts-text sup{font-size:.72em;line-height:0}
.tts-text .tb.feq.done{color:var(--fg)}
.tts-text .tb.cap{font-size:13px;color:var(--muted);font-style:italic;text-align:center}
.tts-text .tb.x-ex{background:var(--surface-2);border-left-color:#b5d9c4;margin:0;border-radius:0}
.tts-text .tb.x-obj{background:var(--accent-soft);border-radius:0}
.tts-text .tb.h.h2{font-size:14.5px;margin-top:8px}
.tts-text .tb.tbl,.tts-text .tb.fig{cursor:default}
.tts-text .tb.fig{text-align:center}
.tts-text .tb.fig img{max-width:100%;height:auto;background:#fff;border-radius:6px}
.tts-text .tb .tbl{margin:4px 0}
.tts-text .tb table{font-size:13px}
.tts-text .tb.on{background:var(--accent-soft);border-left-color:var(--accent)}
.tts-text .tb.done{color:var(--muted)}
/* бие даалт */
.book{display:flex;gap:14px;align-items:flex-start}
.book img{width:110px;border-radius:6px;box-shadow:0 4px 14px rgba(0,60,30,.25);flex:none}
.worktxt{width:100%;min-height:320px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);color:var(--fg);resize:vertical}
.calcrow input{font-family:var(--f-mono)}
.q.drill p{font-weight:400}
.ans{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:14px}
.bdtxt{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;max-height:320px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.grin{width:70px}
.loginbook{display:flex;gap:12px;align-items:center;margin-top:12px}
.loginbook img{width:64px;border-radius:4px}
.mth{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.05em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}.fr>span:last-child{padding:1px 3px 0}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.75em;line-height:1}.ss sup,.ss sub{font-size:1em;vertical-align:baseline}
.sq{border-top:1px solid currentColor;padding:0 2px}
.eqd{text-align:center;margin:8px 0;overflow-x:auto;padding:4px 36px 4px 0;position:relative}
.eqd .eqn{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.fm{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
details>summary{cursor:pointer}
/* ===== dashboard (709) ===== */
.dash{display:flex;flex-direction:column;gap:18px}
.welcome{position:relative;overflow:hidden;border-radius:16px;background:var(--hero,linear-gradient(115deg,#0b3a2b 0%,#16714b 55%,#c9a227 100%));color:#fff;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:150px;box-shadow:0 8px 24px rgba(0,60,30,.18)}
.welcome h1{font-size:clamp(20px,2.6vw,28px);font-weight:800}
.welcome p{margin:6px 0 0;color:#e2f5ea;font-size:14px}
.welcome .wsub{font-size:13px;color:#cdeedb}
.welcome .wart{width:260px;max-width:40%;flex:none}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--fg);box-shadow:0 2px 8px rgba(0,40,20,.05)}
.stat:hover{border-color:var(--accent)}
.stat .si{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.stat .si svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.stat small{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ch h2{margin:0}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ccard{border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--fg);background:var(--surface);display:flex;flex-direction:column}
.ccard:hover{border-color:var(--accent);transform:translateY(-1px)}
.cimg svg{display:block;width:100%;height:auto}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.cbody b{font-size:14.5px}.cbody small{font-size:12px;color:var(--muted)}
.cpb{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:6px}
.cpb i{display:block;height:100%;background:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px;justify-content:center;margin-top:6px}
.sch{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--fg)}
.sch:first-of-type{border-top:0}
.sch .wk{flex:none;width:46px;text-align:center;font-weight:800;font-size:18px;color:var(--accent);line-height:1}
.sch .wk small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.sch b{display:block;font-size:13.5px}.sch small{font-size:12px;color:var(--muted)}
.sch .tag{margin-left:auto;font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:12px;white-space:nowrap}
.donut{position:relative;width:150px;margin:4px auto 10px;text-align:center}
.donut svg{width:150px;height:150px}
.donut b{position:absolute;left:0;right:0;top:48px;font-size:28px;color:var(--accent)}
.donut small{position:absolute;left:0;right:0;top:86px;font-size:12px;color:var(--muted)}
.gtab{width:100%;font-size:13.5px;margin-bottom:8px}.gtab td{padding:4px 0;border-bottom:1px solid var(--line)}.gtab td:last-child{text-align:right;font-weight:600}
.lesson.wait{opacity:.75}
.tline{list-style:none;padding:0;margin:0}.tline li{display:flex;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.tline li:first-child{border-top:0}.tline b{flex:none;width:96px;color:var(--accent)}
.tprof{display:flex;gap:18px;align-items:center}.tprof img{width:110px;height:110px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--accent-soft)}
.ccards{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}.ccards .cbody b{font-size:13.5px}
.sylt th.sh{background:var(--accent);color:#fff;text-align:center;letter-spacing:.04em}.sylt td.sk{font-weight:600;width:240px;background:var(--surface-2)}.sylt td,.sylt th{vertical-align:top}.sh2{font-size:15px;margin:18px 0 8px;color:var(--accent)}
@media print{.side,.top,.formrow .btn{display:none!important}.app{display:block}.card{box-shadow:none;border:0}}
.mats{display:flex;flex-direction:column;gap:8px}
.mat{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg)}
.mat:hover{border-color:var(--accent)}
.mat .mi{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#d64541;flex:none}
.mat .mi.doc{background:#2b6cd4}
.mat b{display:block;font-size:14px}.mat small{font-size:12px;color:var(--muted)}
.mat .dl{margin-left:auto;color:var(--accent);font-size:18px}
tr.now td{background:var(--accent-soft)}
.side{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2,#0b3a2b) 100%)}
.card{box-shadow:0 2px 10px rgba(0,40,20,.05);border-radius:14px}
@media (max-width:1100px){.dgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome .wart{display:none}}

.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.labgrid input{font-family:var(--f-mono)}
.rtab input{width:100%;min-width:90px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--fg)}
.rtab td{padding:4px 6px}.rtab tfoot td{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px}
</style>

<script>
/* I.EEM702 виртуал стендийн тооцооны сан: комплекс тоо, Y матриц, Гаусс-Зейдель, Ньютон-Рафсон, Ш.Гантөмөрийн ба Ньютоны төрлийн аргууд */
window.PF702=(function(){
const C=(re,im)=>({re,im:im||0});
const add=(a,b)=>C(a.re+b.re,a.im+b.im),sub=(a,b)=>C(a.re-b.re,a.im-b.im),mul=(a,b)=>C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);

const memo={};const M=(k,f)=>memo[k]||(memo[k]=f());

function solve(A,b){const n=b.length,a=A.map((r,i)=>r.concat([b[i]]));for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(a[i][k])>Math.abs(a[p][k]))p=i;if(Math.abs(a[p][k])<1e-14)return null;[a[k],a[p]]=[a[p],a[k]];for(let i=k+1;i<n;i++){const f=a[i][k]/a[k][k];for(let j=k;j<=n;j++)a[i][j]-=f*a[k][j]}}const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=a[i][n];for(let j=i+1;j<n;j++)s-=a[i][j]*x[j];x[i]=s/a[i][i]}return x}

х.", "tasks": ["Гурван бүсийн суурь хүчдэл, гүйдэл, эсэргүүцлийг тодорхойлох.", "Бүх элементийн о.н эсэргүүцлийг суурь солих томьёогоор тооцож урвалын диаграмм зурах.", "Ачааллын о.н чадал, гүйдлийг олох.", "Генераторын шины хүчдэл (о.н, кВ), генераторын ЭХХ, гүйдлийг (А) бүсүүдэд тооцох.", "Генераторын өгөх чадал, сүлжээний идэвхтэй ба идэвхгүй чадлын алдагдлыг тооцох.", "Генераторын шины хүчдэл 1.10 о.н-ээс хэтрэхгүй байх ачааллын шины конденсаторын чадлыг олж дүгнэх."], "vars": [["Шугамын урт <span class=\"mth\">L</span>", "км", ["80", "100", "120", "90", "110", "70", "130", "95", "105", "85"]], ["Ачааллын чадал <span class=\"mth\">P</span>", "МВт", ["30", "25", "35", "28", "32", "20", "40", "26", "33", "22"]], ["Чадлын коэффициент <span class=\"mth\">cos φ</span> (инд.)", "", ["0.85", "0.9", "0.8", "0.85", "0.88", "0.9", "0.82", "0.86", "0.84", "0.92"]], ["Ачааллын шины хүчдэл <span class=\"mth\">U<sub>4</sub></span>", "кВ", ["13.2", "13.0", "13.2", "12.8", "13.2", "13.5", "13.0", "13.2", "12.9", "13.2"]]], "consts": "Генератор 40 МВА, 13.2 кВ, <span class=\"mth\">X″ = 0.2</span>; T1: 50 МВА, 13.2/132 кВ, <span class=\"mth\">u<sub>к</sub> = 10%</span>; шугам <span class=\"mth\">z<sub>0</sub> = 0.333+j1.0</span> Ом/км; T2: 50 МВА, 132/13.2 кВ, <span class=\"mth\">u<sub>к</sub> = 8%</span>. <span class=\"mth\">S<sub>б</sub> = 100</span> МВА, генераторын бүсэд <span class=\"mth\">U<sub>б</sub> = 13.8</span> кВ. Ачаалал тогтмол чадалтай; R-ийг трансформаторт үл тооно.", "form": [["Суурь", "<span class=\"mth\">I<sub>б</sub> = <span class=\"fr\"><span>S<sub>б</sub></span><span>√<span class=\"sq\">3</span>U<sub>б</sub></span></span>,&emsp;&emsp;Z<sub>б</sub> = <span class=\"fr\"><span>U<span class=\"ss\"><sup>2</sup><sub>б</sub></span></span><span>S<sub>б</sub></span></span></span>"], ["Суурь солих", "<span class=\"mth\">Z<sub>шинэ</sub> = Z<sub>хуучин</sub>·(<span class=\"fr\"><span>U<sub>хуучин</sub></span><span>U<sub>шинэ</sub></span></span>)<sup>2</sup>·<span class=\"fr\"><span>S<sub>шинэ</sub></span><span>S<sub>хуучин</sub></span></span></span>"], ["Ачааллын гүйдэл", "<span class=\"mth\">I = (<span class=\"fr\"><span>S</span><span>U</span></span>)<sup>*</sup></span>"], ["Хүчдэл", "<span class=\"mth\">U<sub>1</sub> = U<sub>4</sub>+I·(jX<sub>T1</sub>+Z<sub>ш</sub>+jX<sub>T2</sub>)</span>"], ["Алдагдал", "<span class=\"mth\">ΔS = S<sub>Г</sub>-S<sub>ачаалал</sub></span>"]], "ex": "<p class=\"prose\"><b>Хувилбар 1:</b> <span class=\"mth\">L = 80</span> км, <span class=\"mth\">P = 30</span> МВт, <span class=\"mth\">cos φ = 0.85</span>, <span class=\"mth\">U<sub>4</sub> = 13.2</span> кВ.</p><h3 style=\"margin:16px 0 6px\">1. Суурь хэмжигдэхүүн</h3><div class=\"eqd\"><span class=\"mth\">U<sub>б1</sub> = 13.8 кВ,&emsp;&emsp;U<sub>б2</sub> = 13.8·<span class=\"fr\"><span>138</span><span>13.8</span></span> = 138.0 кВ,&emsp;&emsp;U<sub>б3</sub> = 138.0·<span class=\"fr\"><span>13.2</span><span>132</span></span> = 13.80 кВ</span></div><div class=\"eqd\"><span class=\"mth\">Z<sub>б2</sub> = <span class=\"fr\"><span>138<sup>2</sup></span><span>100</span></span> = 190.44 Ом,&emsp;&emsp;I<sub>б2</sub> = 418.4 А,&emsp;&emsp;I<sub>б3</sub> = 4184 А</span></div><p class=\"prose\">Анхаар: T1-ийн нэрлэсэн коэффициент 13.2/132 бол генераторын бүсийн 13.8 кВ сууриас шилжүүлэхэд 138 кВ гарна (суурийн харьцаа = нэрлэсэн харьцаа).</p><h3 style=\"margin:16px 0 6px\">2. Элементийн о.н эсэргүүцэл</h3><div class=\"eqd\"><span class=\"mth\">X<sub>Г</sub> = 0.2·(<span class=\"fr\"><span>13.2</span><span>13.8</span></span>)<sup>2</sup>·<span class=\"fr\"><span>100</span><span>40</span></span> = 0.4575,&emsp;&emsp;X<sub>T1</sub> = 0.10·<span class=\"fr\"><span>100</span><span>50</span></span> = 0.2000</span></div><div class=\"eqd\"><span class=\"mth\">Z<sub>ш</sub> = <span class=\"fr\"><span>(0.333+j1.0)·80</span><span>190.44</span></span> = 0.1399 + j0.4201,&emsp;&emsp;X<sub>T2</sub> = 0.08·(<span class=\"fr\"><span>132</span><span>138</span></span>)<sup>2</sup>·<span class=\"fr\"><span>100</span><span>50</span></span> = 0.1464</span></div><h3 style=\"margin:16px 0 6px\">3. Ачааллын горим</h3><div class=\"eqd\"><span class=\"mth\">U<sub>4</sub> = <span class=\"fr\"><span>13.2</span><span>13.80</span></span> = 0.9565∠0°,&emsp;&emsp;S = <span class=\"fr\"><span>30+j18.59</span><span>100</span></span> = 0.3000 + j0.1859</span></div><div class=\"eqd\"><span class=\"mth\">I = (<span class=\"fr\"><span>S</span><span>U<sub>4</sub></span></span>)<sup>*</sup> = 0.3690∠-31.79° о.н</span></div><h3 style=\"margin:16px 0 6px\">4. Генераторын шины хүчдэл ба гүйдэл</h3><div class=\"eqd\"><span class=\"mth\">U<sub>1</sub> = U<sub>4</sub>+I·(0.1399 + j0.7665) = 1.1690∠10.51° о.н  =  16.13 кВ</span></div><div class=\"eqd\"><span class=\"mth\">E<sub>Г</sub> = U<sub>1</sub>+I·jX<sub>Г</sub> = 1.2886∠16.07° о.н</span></div><div class=\"eqd\"><span class=\"mth\">I<sub>ш</sub> = 0.3690·418.4 = 154.4 А,&emsp;&emsp;I<sub>ачаалал</sub> = 0.3690·4184 = 1544 А</span></div><h3 style=\"margin:16px 0 6px\">5. Чадал ба алдагдал</h3><div class=\"eqd\"><span class=\"mth\">S<sub>Г</sub> = U<sub>1</sub>I<sup>*</sup> = 0.3190 + j0.2903 о.н  =  31.90 МВт + j29.03 Мвар</span></div><div class=\"eqd\"><span class=\"mth\">ΔS = S<sub>Г</sub>-S = 1.90 МВт + j10.44 Мвар</span></div><p class=\"prose\">Идэвхгүй чадлын алдагдал идэвхтэйгээс 5.5 дахин их — трансформатор ба шугамын урвал давамгай.</p><h3 style=\"margin:16px 0 6px\">6. Компенсаци</h3><p class=\"prose\">Генераторын шины хүчдэл 1.169 о.н буюу 16.1 кВ нь зөвшөөрөгдөх 1.10 о.н-ээс хэтэрсэн. Ачааллын шинд <span class=\"mth\">Q<sub>C</sub></span> конденсатор тавьж <span class=\"mth\">S = 0.30+j(0.186-Q<sub>C</sub>)</span> гэж давталтаар тооцоход <span class=\"mth\">Q<sub>C</sub>≈9.2</span> Мвар үед <span class=\"mth\">|U<sub>1</sub>| = 1.10</span> болно.</p><p class=\"prose\"><b>Дүгнэлт:</b> 132 кВ шугамаар ачааллын идэвхгүй чадлыг дамжуулах нь хүчдэлийн уналтыг их болгож, генераторыг хэт хүчдэлд ажиллуулахад хүргэнэ; идэвхгүй чадлыг ачааллын ойролцоо нөхөх нь хүчдэл ба алдагдлын хувьд хамгийн үр дүнтэй.</p>"}, {"n": 2, "t": "Шугамын R, L, C параметр ба бодит эсэргүүцлийг бодох Ш.Гантөмөрийн арга", "lec": "2–3", "wk": 8, "pts": 5, "goal": "110 кВ-ын агаарын шугамын нэгжид ногдох идэвхтэй эсэргүүцэл, индуктив эсэргүүцэл, багтаамжит дамжуулалтыг утасны марк ба тулгуурын геометрээс тооцох; утасны халалтыг гүйдэл ба орчны температураас хамааруулж эсэргүүцлийг тогтсон горимтой хамт давтан тооцох (Ш.Гантөмөрийн арга); алдагдлыг лавлах утгаар тооцсонтой харьцуулах; цэнэглэх чадал, долгионы эсэргүүцэл, байгалийн чадлыг үнэлэх.", "tasks": ["<span class=\"mth\">r<sub>0</sub>(20)</span>, <span class=\"mth\">D<sub>ср</sub></span>, <span class=\"mth\">x<sub>0</sub></span>, <span class=\"mth\">C<sub>0</sub></span>, <span class=\"mth\">b<sub>0</sub></span>-ийг тооцох.", "Орчны температурт гүйдэлгүй үеийн эсэргүүцлээр төгсгөлийн хүчдэлийг олох.", "Гүйдэл → утасны температур → эсэргүүцлийг Ш.Гантөмөрийн аргаар давтан, нийлэх хүртэл хүснэгтээр тооцох.", "Бодит эсэргүүцэл ба 20°C-ийн лавлах утгаар тооцсон алдагдлыг харьцуулах (%).", "Шугамын цэнэглэх чадал, долгионы эсэргүүцэл, байгалийн чадлыг тооцох.", "Ачаалал SIL-ээс бага эсэх, шугам идэвхгүй чадал үйлдвэрлэх эсэхийг дүгнэх."], "vars": [["Утасны марк", "", ["АС-240/32", "АС-185/29", "АС-300/39", "АС-240/32", "АС-300/39", "АС-185/29", "АС-400/51", "АС-240/32", "АС-300/39", "АС-400/51"]], ["Хөрш фаз хоорондын зай <span class=\"mth\">D</span> (хэвтээ)", "м", ["5", "4.5", "6", "5", "5.5", "4.5", "6", "5.5", "6", "6.5"]], ["Шугамын урт <span class=\"mth\">L</span>", "км", ["80", "60", "120", "100", "90", "70", "150", "110", "130", "140"]], ["Төгсгөлийн ачаалал <span class=\"mth\">P</span>", "МВт", ["50", "35", "70", "55", "60", "40", "90", "50", "75", "85"]], ["Төгсгөлийн ачаалал <span class=\"mth\">Q</span>", "Мвар", ["20", "15", "30", "25", "25", "18", "40", "22", "30", "35"]], ["Орчны температур <span class=\"mth\">t<sub>о</sub></span>", "°C", ["30", "25", "30", "35", "20", "30", "25", "-10", "35", "30"]]], "consts": "Эхлэлийн хүчдэл <span class=\"mth\">U<sub>1</sub> = 118</span> кВ; хөнгөн цагааны <span class=\"mth\">ρ = 28.2</span> Ом·мм²/км, <span class=\"mth\">α = 0.00403</span> 1/°C; АС утасны <span class=\"mth\">GMR = 0.81r</span>; фазууд хэвтээ, <span class=\"mth\">D–D–2D</span>, транспозицтай. Утасны огтлол, диаметр: АС-185/29 — 181 мм², 18.8 мм; АС-240/32 — 244 мм², 21.6 мм; АС-300/39 — 301 мм², 24.0 мм; АС-400/51 — 394 мм², 27.5 мм.", "form": [["Идэвхтэй эсэргүүцэл", "<span class=\"mth\">r<sub>0</sub>(t) = <span class=\"fr\"><span>ρ</span><span>F</span></span>[1+α(t-20)]</span>"], ["Утасны температур (Ш.Гантөмөр)", "<span class=\"mth\">t′ = t<sub>о</sub>+8.3δ<sup>2</sup>√<span class=\"sq\"><span class=\"fr\"><span>F</span><span>300</span></span></span>,&emsp;&emsp;δ = <span class=\"fr\"><span>I</span><span>F</span></span></span>"], ["Индуктив эсэргүүцэл", "<span class=\"mth\">x<sub>0</sub> = 0.0628·ln<span class=\"fr\"><span>D<sub>ср</sub></span><span>0.81r</span></span>,&emsp;&emsp;D<sub>ср</sub> = √<span class=\"sq\">[</span>3]D·D·2D</span>"], ["Багтаамж", "<span class=\"mth\">C<sub>0</sub> = <span class=\"fr\"><span>2πε<sub>0</sub></span><span>ln(D<sub>ср</sub>/r)</span></span>,&emsp;&emsp;b<sub>0</sub> = ωC<sub>0</sub></span>"], ["Төгсгөлийн хүчдэл", "<span class=\"mth\">U<span class=\"ss\"><sup>2</sup><sub>1</sub></span> = (U<sub>2</sub>+<span class=\"fr\"><span>PR+QX</span><span>U<sub>2</sub></span></span>)<sup>2</sup>+(<span class=\"fr\"><span>PX-QR</span><span>U<sub>2</sub></span></span>)<sup>2</sup></span>"], ["Байгалийн чадал", "<span class=\"mth\">Z<sub>c</sub> = √<span class=\"sq\"><span class=\"fr\"><span>x<sub>0</sub></span><span>b<sub>0</sub></span></span></span>,&emsp;&emsp;P<sub>нат</sub> = <span class=\"fr\"><span>U<sup>2</sup></span><span>Z<sub>c</sub></span></span></span>"]], "ex": "<p class=\"prose\"><b>Хувилбар 1:</b> АС-240/32, <span class=\"mth\">D = 5</span> м, <span class=\"mth\">L = 80</span> км, <span class=\"mth\">S = 50+j20</span> МВА, <span class=\"mth\">t<sub>о</sub> = 30</span>°C.</p><h3 style=\"margin:16px 0 6px\">1. Нэгжийн параметр</h3><div class=\"eqd\"><span class=\"mth\">r<sub>0</sub>(20) = <span class=\"fr\"><span>28.2</span><span>244</span></span> = 0.1156 Ом/км,&emsp;&emsp;D<sub>ср</sub> = √<span class=\"sq\">[</span>3]5·5·10 = 6.30 м</span></div><div class=\"eqd\"><span class=\"mth\">x<sub>0</sub> = 0.0628·ln<span class=\"fr\"><span>6300</span><span>0.81·10.8</span></span> = 0.4132 Ом/км,&emsp;&emsp;b<sub>0</sub> = 2.744 мкСм/км</span></div><h3 style=\"margin:16px 0 6px\">2. Ш.Гантөмөрийн аргын давталт</h3><div class=\"tbl\"><table><tr><th>Давталт</th><th>R, Ом</th><th>U₂, кВ</th><th>I, А</th><th>t′, °C</th><th>R<sub>шинэ</sub>, Ом</th></tr><tr><td class=\"\">1</td><td class=\"c\">9.619</td><td class=\"c\">106.47</td><td class=\"c\">292.0</td><td class=\"c\">40.72</td><td class=\"c\">10.018</td></tr><tr><td class=\"\">2</td><td class=\"c\">10.018</td><td class=\"c\">106.27</td><td class=\"c\">292.6</td><td class=\"c\">40.76</td><td class=\"c\">10.019</td></tr><tr><td class=\"\">3</td><td class=\"c\">10.019</td><td class=\"c\">106.27</td><td class=\"c\">292.6</td><td class=\"c\">40.76</td><td class=\"c\">10.020</td></tr></table></div><p class=\"prose\">Эхний давталтад эсэргүүцлийг орчны температурт <span class=\"mth\">R = 9.619</span> Ом гэж авав. Гүйдэл 292 А үед утас 10.7°C-аар халж, эсэргүүцэл 10.020 Ом-д нийлэв.</p><h3 style=\"margin:16px 0 6px\">3. Алдагдлын харьцуулалт</h3><div class=\"eqd\"><span class=\"mth\">ΔP = <span class=\"fr\"><span>P<sup>2</sup>+Q<sup>2</sup></span><span>U<span class=\"ss\"><sup>2</sup><sub>2</sub></span></span></span>R = <span class=\"fr\"><span>2900</span><span>106.27<sup>2</sup></span></span>·10.020 = 2.573 МВт</span></div><div class=\"eqd\"><span class=\"mth\">ΔP<sub>20°C</sub> = 2.374 МВт&emsp;&emsp; ⇒ &emsp;&emsp;зөрүү 7.7%</span></div><h3 style=\"margin:16px 0 6px\">4. Цэнэглэх чадал ба SIL</h3><div class=\"eqd\"><span class=\"mth\">Q<sub>c</sub> = U<sup>2</sup>b<sub>0</sub>L = 110<sup>2</sup>·2.744·10<sup>-6</sup>·80 = 2.66 Мвар,&emsp;&emsp;Z<sub>c</sub> = 388 Ом,&emsp;&emsp;P<sub>нат</sub> = 31.2 МВт</span></div><p class=\"prose\"><b>Дүгнэлт:</b> Ачаалал 50 МВт нь SIL (31 МВт)-ээс их тул шугам идэвхгүй чадал хэрэглэнэ. Лавлах 20°C-ийн эсэргүүцлээр тооцвол алдагдлыг 8%-иар дутуу үнэлнэ — горимын тооцоонд Ш.Гантөмөрийн аргаар температурын засвар оруулах шаардлагатай.</p>"}, {"n": 3, "t": "Урт шугамын горим: ABCD параметр, Ферранти үзэгдэл, компенсаци", "lec": "4", "wk": 10, "pts": 5, "goal": "500 кВ-ын урт шугамын тархалтын тогтмол, долгионы эсэргүүцэл, ABCD параметрийг гиперболын функцээр тооцож, ачааллын горимд эхлэлийн хүчдэл, гүйдэл, чадал, ашигт үйлийн коэффициент, хүчдэлийн тохируулгыг олох; ачаалалгүй горимын Ферранти үзэгдэл, шунт реакторын чадал, цуваа компенсацийн нөлөөг үнэлэх.", "tasks": ["<span class=\"mth\">γ</span>, <span class=\"mth\">Z<sub>c</sub></span>, долгионы уртыг тооцох.", "ABCD параметрийг гиперболын функцээр тооцож <span class=\"mth\">AD-BC = 1</span>-ийг шалгах.", "Ачааллын горимд <span class=\"mth\">U<sub>s</sub></span>, <span class=\"mth\">I<sub>s</sub></span>, <span class=\"mth\">S<sub>s</sub></span>, <span class=\"mth\">η</span>, хүчдэлийн тохируулгыг тооцох.", "Алдагдалгүй загвараар SIL, ачаалалгүй горимын <span class=\"mth\">U<sub>r</sub>/U<sub>s</sub></span>, <span class=\"mth\">P<sub>max</sub></span>-ийг тооцох.", "Ачаалалгүй үед <span class=\"mth\">U<sub>r</sub> = U<sub>s</sub></span> байлгах шунт реакторын чадлыг олох.", "50% цуваа компенсацийн дараах <span class=\"mth\">P<sub>max</sub></span>-ийг тооцож дүгнэх."], "vars": [["Шугамын урт <span class=\"mth\">L</span>", "км", ["500", "400", "600", "450", "550", "350", "500", "650", "420", "580"]], ["Төгсгөлийн ачаалал <span class=\"mth\">P<sub>r</sub></span>", "МВт", ["700", "600", "800", "650", "750", "500", "900", "700", "550", "850"]], ["Ча Ом,&emsp;&emsp;λ = <span class=\"fr\"><span>2π</span><span>β</span></span> = 5945 км</span></div><h3 style=\"margin:16px 0 6px\">2. ABCD</h3><div class=\"eqd\"><span class=\"mth\">A = D = 0.8639 + j0.0143,&emsp;&emsp;B = 15.00 + j146.08 Ом,&emsp;&emsp;C = j1.7367·10<sup>-3</sup> См</span></div><div class=\"eqd\"><span class=\"mth\">AD-BC = 1.000000</span></div><h3 style=\"margin:16px 0 6px\">3. Ачааллын горим</h3><div class=\"eqd\"><span class=\"mth\">U<sub>r</sub> = 288.68∠0° кВ,&emsp;&emsp;I<sub>r</sub> = 850.8∠-18.19° А</span></div><div class=\"eqd\"><span class=\"mth\">U<sub>s</sub> = AU<sub>r</sub>+BI<sub>r</sub> = 322.76∠21.49° кВ (фаз)  =  559.0 кВ</span></div><div class=\"eqd\"><span class=\"mth\">I<sub>s</sub> = 754.8∠22.05° А,&emsp;&emsp;S<sub>s</sub> = 730.8 − j7.2 МВА</span></div><div class=\"eqd\"><span class=\"mth\">η = <span class=\"fr\"><span>700</span><span>730.8</span></span> = 95.78%,&emsp;&emsp;ХТ = 29.4%</span></div><h3 style=\"margin:16px 0 6px\">4. Алдагдалгүй загвар</h3><div class=\"eqd\"><span class=\"mth\">βl = 30.23°,&emsp;&emsp;Z<sub>c</sub> = 289.9 Ом,&emsp;&emsp;SIL = 862 МВт,&emsp;&emsp;<span class=\"fr\"><span>U<sub>r</sub></span><span>U<sub>s</sub></span></span> = 1.1574,&emsp;&emsp;P<sub>max</sub> = 1712 МВт</span></div><h3 style=\"margin:16px 0 6px\">5. Шунт реактор ба цуваа компенсаци</h3><div class=\"eqd\"><span class=\"mth\">X<sub>L</sub> = 1073 Ом,&emsp;&emsp;Q<sub>L</sub> = <span class=\"fr\"><span>500<sup>2</sup></span><span>1073</span></span> = 233 Мвар,&emsp;&emsp;P<sub>max,50%</sub>≈3425 МВт</span></div><p class=\"prose\"><b>Дүгнэлт:</b> Ачаалал SIL-ийн 81% тул шугам идэвхгүй чадлын хувьд бараг тэнцвэртэй; харин эхлэлийн хүчдэл 559 кВ болж зөвшөөрөгдөх 525 кВ-оос давах тул төгсгөлд компенсаци (SVC) хэрэгтэй; ачаалалгүй горимд төгсгөлийн хүчдэл 579 кВ болж өсөх тул ≈ 233 Мвар шунт реактор шаардлагатай. Цуваа компенсаци дамжуулах хязгаарыг хоёр дахин өсгөнө.</p>"}, {"n": 4, "t": "Сүлжээний Y, Z матриц ба Гаусс-Зейделийн аргаар тогтсон горимыг тооцох", "lec": "5–6", "wk": 12, "pts": 5, "goal": "Гурван зангилаат сүлжээний зангилааны дамжуулалтын матриц Y ба баланслагчийг жишиг болгосон эсэргүүцлийн матриц Z-ийг байгуулах; PV ба PQ зангилаатай тогтсон горимыг Гаусс-Зейделийн аргаар гараар (2 давталт) ба программаар бодох; салааны урсгал, алдагдлыг тооцох; давталтын тоонд хурдасгах коэффициентын нөлөөг судлах.", "tasks": ["Салааны дамжуулалт, Y матрицыг байгуулах.", "Баланслагчийг хасаж 2×2 Y-ийн урвуугаар Z-ийг олж, <span class=\"mth\">Z<sub>33</sub></span>-ийн утгыг тайлбарлах.", "Гаусс-Зейделийн 1, 2-р давталтыг гараар (PV-ийн Q, модулийн засвар) тооцох.", "Программаар нийлэх хүртэл тооцож давталтын хүснэгт гаргах.", "Баланслагчийн чадал, салааны урсгал, алдагдлыг тооцож балансыг шалгах.", "<span class=\"mth\">α = 1.0, 1.2, 1.4, 1.6</span> үед давталтын тоог харьцуулж дүгнэх."], "vars": [["Салааны эсэргүүцлийн үржвэр <span class=\"mth\">k</span>", "", ["1.0", "1.2", "0.8", "1.1", "0.9", "1.3", "1.0", "1.15", "0.85", "1.25"]], ["3-р зангилааны ачаалал <span class=\"mth\">P<sub>3</sub></span>", "МВт", ["90", "80", "100", "85", "95", "70", "110", "75", "105", "90"]], ["<span class=\"mth\">Q<sub>3</sub></span>", "Мвар", ["40", "35", "45", "30", "40", "30", "50", "35", "45", "40"]], ["2-р генераторын <span class=\"mth\">P<sub>2</sub></span>", "МВт", ["40", "30", "50", "35", "45", "25", "50", "30", "40", "45"]], ["<span class=\"mth\">|U<sub>2</sub>|</span>", "о.н", ["1.045", "1.04", "1.05", "1.03", "1.045", "1.04", "1.05", "1.035", "1.045", "1.04"]]], "consts": "<span class=\"mth\">z<sub>12</sub> = k(0.02+j0.06)</span>, <span class=\"mth\">z<sub>13</sub> = k(0.08+j0.24)</span>, <span class=\"mth\">z<sub>23</sub> = k(0.06+j0.18)</span> о.н (100 МВА), шунтгүй. 1 — баланслагч <span class=\"mth\">U<sub>1</sub> = 1.06∠0°</span>; 2 — PV; 3 — PQ. <span class=\"mth\">ε = 10<sup>-6</sup></span>, хавтгай эхлэл.", "form": [["Y матриц", "<span class=\"mth\">Y<sub>ii</sub> = Σy<sub>ik</sub>,&emsp;&emsp;Y< async function apiPost(p){
  if(!API_URL||API_URL.indexOf("http")!==0)throw new Error("noapi");
  const m=me();const body=Object.assign({sid:SID,name:m.name,group:m.group,code:m.code||""},p);

}

let lastAct=Date.now(),pending=0,pendLec={};

function tick(){
  if(document.visibilityState==="visible"&&Date.now()-lastAct<5*60*1000){
    pending+=30;const St=store.get("study",{});const d=today();St[d]=St[d]||{sec:0,lec:[]};St[d].sec+=30;store.set("study",St);
  }
}
function noteLecture(n){const d=today();const St=store.get("study",{});St[d]=St[d]||{sec:0,lec:[]};if(!St[d].lec.includes(n)){St[d].lec.push(n);store.set("study",St)}pendLec[n]=1}
function flushStudy(){
  if(!pending&&!Object.keys(pendLec).length)return;
  const add=pending,lec=Object.keys(pendLec).map(Number),d=today();pending=0;pendLec={};
  if(!me().name){pending+=add;lec.forEach(n=>pendLec[n]=1);return}
  apiPost({action:"study",date:d,sec:add,lec}).catch(()=>{pending+=add;lec.forEach(n=>pendLec[n]=1)});
}

function calcEval(x){x=String(x).replace(/[×·]/g,"*").replace(/[−–]/g,"-").replace(/,/g,".").replace(/\^/g,"**");
  if(!/^[\d\s+\-*/().eE]*$/.test(x.replace(/\b(sqrt|ln|log10|exp|sin|cos|tan|pi|abs)\b/g,"")))throw new Error("sym");
  const r=Function("sqrt","ln","log10","exp","sin","cos","tan","pi","abs",'"use strict";return ('+x+")")(Math.sqrt,Math.log,Math.log10,Math.exp,Math.sin,Math.cos,Math.tan,Math.PI,Math.abs);
  if(typeof r!=="number"||!isFinite(r))throw new Error("nan");return +r.toPrecision(6)}
function bdSave(n,text){const L=bdLocal();L[n]=Object.assign(L[n]||{},{text,at:new Date().toISOString()});store.set("bd",L);const e=document.getElementById("bdSaved");if(e)e.textContent="Хадгалсан: "+new Date().toLocaleString("mn-MN")}
async function bdSend(n){const m=document.getElementById("bdMsg");const text=document.getElementById("bdText").value;const f=document.getElementById("bdFile").files[0];
  if(!text.trim()&&!f){m.innerHTML='<div class="status bad">Ажлын талбар хоосон, файл хавсаргаагүй байна.</div>';return}
  if(f&&f.size>8*1024*1024){m.innerHTML='<div class="status bad">Файл 8 МБ-аас их байна.</div>';return}
  bdSave(n,text);const btn=document.getElementById("bdSend");btn.disabled=true;m.innerHTML='<p class="small muted">Илгээж байна…</p>';
  let file=null;try{if(f){const data=await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=bad;r.readAsDataURL(f)});file={name:f.name,type:f.type||"application/octet-stream",data}}
    await apiPost({action:"bd",bd:n,text,file});
    const L=bdLocal();L[n]=Object.assign(L[n]||{},{sent:new Date().toISOString()});store.set("bd",L);
    BDSRV=BDSRV||{};BDSRV[n]={at:new Date().toISOString(),file:!!file,grade:"",comment:""};
    m.innerHTML='<div class="status ok">Илгээгдлээ. Багш дүгнэсний дараа дүн энд болон «Миний оноо» хэсэгт харагдана.</div>'}
  catch(e){m.innerHTML=`<div class="status bad">${e.message==="noapi"?"Сервер холбогдоогүй байна (багш API хаягийг тохируулаагүй).":e.message==="graded"?"Энэ ажлыг багш дүгнэсэн тул дахин илгээх боломжгүй.":e.message==="not_enrolled"?"Таны код хичээлийн жагсаалтад алга.":"Илгээж чадсангүй. Интернэт холболтоо шалгаад дахин оролдоно уу."} Ноорог энэ төхөөрөмжид хадгалагдсан.</div>`}
  btn.disabled=false}

function labCalc(n){const L=D.labs[n-1];const ids=L.inputs.map(i=>i[0]);const vals=ids.map(id=>parseFloat(document.querySelector(`[data-li="${id}"]`).value));
  return L.outputs.map(o=>{try{const r=Function(...ids,'"use strict";return ('+o[2]+")")(...vals);return isFinite(r)?(+r).toFixed(o[3]):"—"}catch(e){return "—"}})}
function labBind(){const add=document.getElementById("labAdd");if(!add)return;const n=+add.dataset.lab;const L=D.labs[n-1];
  const upd=()=>{const r=labCalc(n);r.forEach((x,k)=>{const e=document.querySelector(`[data-lo="${k}"]`);if(e)e.textContent=x});const s=store.get("labin",{});s[n]={};L.inputs.forEach(i=>{s[n][i[0]]=document.querySelector(`[data-li="${i[0]}"]`).value});store.set("labin",s)};
  document.querySelectorAll("[data-li]").forEach(e=>e.addEventListener("input",upd));upd();

function fnv(s){let h=0x811c9dc5;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(36).toUpperCase().padStart(7,"0").slice(-7)}

async function grade(forced){
  if(!cur||cur.done)return;
  const res=document.getElementById("res");
  let name,group,code;
  if(cur.kind==="t"){name=document.getElementById("nm").value.trim();group=document.getElementById("gr").value.trim();code=document.getElementById("cd").value.trim();

    store.set("me",{name,group,code})}else{name=cur.name;group=cur.group;code=cur.code}
  const un=cur.qs.filter((_,i)=>!document.querySelector(`input[name=a${i}]:checked`)).length;
  if(un&&!forced){res.innerHTML=`<div class="status warn">${un} асуултад хариулаагүй байна.</div>`;return}
  let sc=0;cur.qs.forEach((x,i)=>{const c=document.querySelector(`input[name=a${i}]:checked`);const sel=c?+c.value:-1;if(sel===x.q[2])sc++;
    document.querySelectorAll(`#q${i} label`).forEach(lb=>{const v=+lb.querySelector("input").value;if(cur.kind==="t"){if(v===x.q[2])lb.classList.add("right");else if(v===sel)lb.classList.add("wrong")}lb.querySelector("input").disabled=true})});
  cur.done=true;clearInterval(timerId);if(cur.kind==="t")document.getElementById("tf").classList.add("done");document.getElementById("sub").disabled=true;
  const sec=Math.round((Date.now()-cur.start)/1000),at=new Date().toISOString(),tot=cur.qs.length;
  let key,rec;
  if(cur.kind==="t"){key="t"+pad(cur.n);const L=local();const prev=L[key];L[key]={best:Math.max(sc,prev?prev.best:0),last:sc,attempts:(prev?prev.attempts:0)+1,at};store.set("results",L)}
  else{key="final";store.set("final",{score:sc,at,sec})}
  const vcode=fnv(`${name}|${group}|${key}|${sc}|${at}`);
  res.innerHTML=`<div class="score"><b>${sc}/${tot}</b>${cur.kind==="f"?"<span>Улирлын шалгалтын зөв хариулт харагдахгүй.</span>":""}<span>${forced?"Хугацаа дуусч автоматаар илгээгдлээ · ":""}${Math.floor(sec/60)} мин ${sec%60} с</span></div><div id="sv" class="status warn">Дүнг хадгалж байна…</div>`;
  nav();
  const sv=document.getElementById("sv");
  try{
    await apiPost({action:"result",key,score:sc,total:tot,sec,items:cur.qs.map((x,i)=>{const c=document.querySelector(`input[name=a${i}]:checked`);const sel=c?+c.value:-1;const id=x.id||(cur.n+"."+(D.tests[cur.n].indexOf(x.q)+1));return id+":"+sel+":"+(sel===x.q[2]?1:0)})});
    sv.className="status ok";sv.innerHTML=`Дүн багшид хадгалагдлаа. Баталгааны код: <span class="codebox">${vcode}</span>`;
  }catch(err){sv.innerHTML=`${err.message==="final_exists"?"Таны улирлын шалгалт өмнө нь бүртгэгдсэн тул энэ оролдлого тооцогдохгүй.":"Багшийн санд хадгалагдсангүй (интернэт холболтоо шалгана уу)."} Дэлгэцийн зургийг багшид илгээнэ үү.<br>Баталгааны код: <span class="codebox">${vcode}</span> · ${esc(name)} · ${esc(group)} · ${key==="final"?"Улирлын шалгалт":"Тест "+cur.n}: ${sc}/${tot} · ${new Date(at).toLocaleString("mn-MN")}`}
}

/* ---------- лекцийг монголоор чангаар унших (хөтчийн Web Speech API) ----------
   Лекцийн бичвэр tts/lecNN.json-д (PDF-ээс гаргасан: гарчиг h, догол мөр p, томьёо eq, зураг/хүснэгтийн тайлбар cap).
   Монгол дуу хоолой (mn-MN) — Microsoft Edge хөтчийн «Microsoft Bataa / Yesui Online (Natural) — Mongolian».
   Монгол дуу хоолойгүй хөтчид бусад дуу хоолойг сонгож болно (кирилл бичгийг ойролцоо уншина). */
const ART_URL="https://gantumur2020-spec.github.io/IEEM702/";
const TTS=(()=>{
  const syn=("speechSynthesis" in window)?window.speechSynthesis:null;
  let lec=0,blocks=null,idx=0,parts=[],pi=0,playing=false,paused=false,voices=[],gen=0;
  const opt=Object.assign({rate:1,voice:"",eq:false,gender:"m"},store.get("tts",{}));
  const saveOpt=()=>store.set("tts",opt);
  const posKey=n=>"ttspos"+n;
  function loadVoices(){if(!syn)return;voices=syn.getVoices().slice().sort((a,b)=>(b.lang.toLowerCase().startsWith("mn")-a.lang.toLowerCase().startsWith("mn"))||a.name.localeCompare(b.name));fillVoices()}
  if(syn){loadVoices();syn.addEventListener?syn.addEventListener("voiceschanged",loadVoices):(syn.onvoiceschanged=loadVoices)}
  let vWait=true;setTimeout(()=>{vWait=false;note()},3000);
  const mnVoices=()=>voices.filter(v=>v.lang.toLowerCase().startsWith("mn"));
  // дуу хоолойн хүйс: Bataa — эрэгтэй, Yesui — эмэгтэй; бусад хэлний түгээмэл нэрсээр
  const FEM=/yesui|female|эмэгтэй|zira|aria|jenny|michelle|sonia|libby|natasha|svetlana|dariya|irina|ekaterina|milena|katya|alena|samantha|victoria|karen|moira|tessa|fiona|susan|hazel|heera|google.*(female|uk english female)|салтанат|aigul/i;
  const MAL=/bataa|male|эрэгтэй|david|mark|guy|ryan|thomas|george|dmitry|pavel|maxim|yuri|alex|daniel|fred|oliver|james|ravi|google.*male/i;
  const genderOf=v=>!v?"":(FEM.test(v.name)?"f":(MAL.test(v.name)?"m":""));
  function voiceFor(g){const mn=mnVoices();return mn.find(v=>genderOf(v)===g)||null}
  function pickVoice(){if(!voices.length)return null;
    const byName=voices.find(v=>v.name===opt.voice);if(byName&&(byName.lang.toLowerCase().startsWith("mn")||!mnVoices().length))return byName;
    return voiceFor(opt.gender)||mnVoices()[0]||voices.find(v=>/^ru/i.test(v.lang)&&genderOf(v)===opt.gender)||voices.find(v=>/^ru/i.test(v.lang))||null}
  // сонгосон дуу хоолой хүссэн хүйсийнх биш бол өнгийг (pitch) өөрчилж ойртуулна
  function pitchFor(v){const g=genderOf(v);if(!opt.gender||g===opt.gender)return 1;return opt.gender==="f"?1.35:0.75}
  function setGender(g){opt.gender=g;const v=voiceFor(g)||voices.find(x=>genderOf(x)===g&&/^ru/i.test(x.lang))||null;
    opt.voice=v?v.name:(pickVoice()||{}).name||"";saveOpt();fillVoices();paintGender();if(playing&&!paused)startAt(idx)}
  function paintGender(){["m","f"].forEach(g=>{const b=document.getElementById("ttsG"+g);if(b){b.classList.toggle("on",opt.gender===g);b.setAttribute("aria-pressed",opt.gender===g)}});
    const h=document.getElementById("ttsGnote");if(!h)return;const v=pickVoice();
    if(!voices.length){h.textContent="";return}
    h.textContent=v&&genderOf(v)===opt.gender?"":(opt.gender==="f"?"Эмэгтэй дуу хоолой олдсонгүй — өнгийг өндөрсгөж уншина.":"Эрэгтэй дуу хоолой олдсонгүй — өнгийг намсгаж уншина.")}
  function fillVoices(){const s=document.getElementById("ttsVoice");if(!s)return;const cur=pickVoice();
    s.innerHTML=voices.length?voices.map(v=>`<option value="${esc(v.name)}"${cur&&v.name===cur.name?" selected":""}>${v.lang.toLowerCase().startsWith("mn")?"★ ":""}${esc(v.name)} (${esc(v.lang)})</option>`).join(""):'<option value="">Дуу хоолой ачаалж байна…</option>';
    if(!cur&&voices.length){const fb=voices.find(v=>/^ru/i.test(v.lang))||voices[0];s.value=fb.name}
    note();paintGender()}
  function note(){const el=document.getElementById("ttsNote");if(!el)return;
    if(!syn){el.className="status bad";el.textContent="Энэ хөтөч дуу гаргах (Web Speech) боломжгүй. Microsoft Edge эсвэл Chrome-ийн шинэ хувилбараар нээнэ үү.";return}
    if(!voices.length){el.className="status warn";el.innerHTML=vWait?"Дуу хоолойн жагсаалт ачаалж байна…":"Энэ хөтчид дуу хоолой олдсонгүй. Хуудсыг <b>Microsoft Edge</b> хөтчөөр нээвэл «Microsoft Bataa / Yesui — Mongolian» дуу хоолойгоор уншина.";return}
    if(mnVoices().length){el.className="status ok";el.innerHTML="Монгол дуу хоолой олдлоо: <b>"+esc(mnVoices().map(v=>v.name.replace(/^Microsoft\s*/,"").replace(/\s*Online.*$/,"")+(genderOf(v)==="f"?" (эмэгтэй)":genderOf(v)==="m"?" (эрэгтэй)":"")).join(", "))+"</b>.";return}
    const ru=voices.find(v=>/^ru/i.test(v.lang));
    el.className="status bad";el.innerHTML="<b>Энэ цонхонд (хөтчид) монгол дуу хоолой алга</b> — англи дуу хоолой монгол бичвэрийг уншиж чадахгүй. "+
      "Хуудсыг <b>Microsoft Edge</b> хөтчөөр нээнэ үү: "+
      "<a href=\"microsoft-edge:"+ART_URL+"\" target=\"_blank\" rel=\"noopener\">Edge-ээр нээх</a> эсвэл энэ холбоосыг Edge-д хуулж нээнэ: <span class=\"codebox\" style=\"font-size:12px;letter-spacing:0;user-select:all\">"+ART_URL+"</span>. "+
      "Edge дээр «Microsoft Bataa» (эрэгтэй), «Microsoft Yesui» (эмэгтэй) монгол дуу хоолой автоматаар сонгогдоно."+(ru?" Түр зуур орос дуу хоолой («"+esc(ru.name)+"») кирилл бичгийг ойролцоогоор уншина.":"")}

  /* --- бичвэрийг уншихад бэлтгэх: тэмдэгт, нэгж, латин үсэг --- */
  const GR={"Δ":"дельта ","δ":"дельта ","θ":"тэта ","φ":"фи ","λ":"ламбда ","ω":"омега ","π":"пи ","ρ":"ро ","α":"альфа ","β":"бета ","γ":"гамма ","μ":"мю ","σ":"сигма ","τ":"тау ","η":"эта ","ε":"эпсилон ","ψ":"пси ","Σ":" нийлбэр ","∑":" нийлбэр ","√":" язгуур ","∛":" куб язгуур ","∂":" тухайн уламжлал ","∞":" хязгааргүй ","≈":" ойролцоогоор ","≤":" бага буюу тэнцүү ","≥":" их буюу тэнцүү ","≠":" тэнцүү биш ","→":", ","·":" ","×":" үржих ","±":" нэмэх хасах ","∠":" өнцөг ","′":" штрих","″":" хос штрих","…":", ","—":", ","̇":"","∙":" "};
  const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"хасах ","⁺":""};

  const LAT={a:"а",b:"бэ",c:"цэ",d:"дэ",e:"е",f:"эф",g:"гэ",h:"аш",i:"и",j:"жи",k:"ка",l:"эл",m:"эм",n:"эн",o:"о",p:"пэ",q:"ку",r:"эр",s:"эс",t:"тэ",u:"у",v:"вэ",w:"вэ",x:"икс",y:"игрек",z:"зэт"};
  // нэгж + дагавар: «кВ-д» → «киловольтод», «%-иар» → «хувиар»
  function joinSuf(w,suf){if(/ь$/.test(w)&&/^и/.test(suf))return w.slice(0,-1)+suf;if(/^[аэоөуүияыеё]/.test(suf))return w+suf;
    const v=(w.match(/[аэоөуүи]/g)||["а"]).pop();return w+({"у":"о","и":"э","ү":"ө"}[v]||v)+suf}
  const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  function speakable(s){
    s=s.replace(/(\d)([⁻⁺]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,(m,a,b)=>a+" зэрэг "+[...b].map(c=>SUP[c]).join("")+" ");

    s=s.replace(/(\d)\s*[–-]\s*(\d)/g,"$1, $2");

    s=s.replace(/(?<![\p{L}])([A-Za-z]{1,3})(?=[\d\s,.;:)(\]/=–-]|$)/gu,(m,w)=>/^(PV|DC|AC|SC|USC|CFB|PC|CSP|SMR|PWR|BWR|SCR|FGD|ESP|DCS|PID|SIS|SIL|AGC|ASU|DLN|TIT|AEP|NPV|IRR|LFP|CHP|PES|IGCC|CCGT|HRSG|LCOE|LCOS|BESS|LNG|SNCR|IMC|PFD|DNI|GHI|PR)$/.test(w)?[...w].map(c=>LAT[c.toLowerCase()]).join(" ")+" ":[...w].map(c=>LAT[c.toLowerCase()]||c).join(" ")+" ");

  function blockText(b){

  function split(s){ // Chrome урт өгүүлбэрийг таслах тул ~220 тэмдэгтээр хуваана
